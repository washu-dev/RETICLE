/* ---------- lookup ---------- */
/* How long to wait before calling it: the wiki answers in well under a second when the database
   is healthy, and a degraded RDS has been measured at 47 s. Without a deadline fetch() has none,
   so the page just kept saying "Assembling" until the user gave up. */
const LOOKUP_TIMEOUT_MS=20000;

/* One failure renderer for every way the lookup can fail, so the message always says which
   layer broke. The old code showed "Could not reach the server." for a server that had in fact
   answered — it read the body with r.json() BEFORE checking r.ok, and uvicorn returns its 500 as
   plain text, so the parse threw and every server-side failure fell into the network branch. */
function lookupFailed(g,msg,retry){
  const st=$('#status');
  st.style.display='block'; st.className='status err';
  st.innerHTML=esc(msg)+(retry?' <button class="retry-btn" id="lk-retry">Try again</button>':'');
  if(retry){ const b=$('#lk-retry'); if(b) b.onclick=()=>lookup(g); }
}

async function lookup(g){
  g=(g||'').trim(); if(!g) return;
  const taxid=$('#tax').value;
  document.body.classList.remove('landing');
  $('#empty').style.display='none'; $('#gw').classList.remove('show'); $('#gw').innerHTML=''; $('#foot').innerHTML='';
  const st=$('#status'); st.style.display='block'; st.className='status'; st.textContent='Assembling '+g+'…';
  const ac=('AbortController' in window)?new AbortController():null;
  const timer=setTimeout(()=>{ if(ac) ac.abort(); }, LOOKUP_TIMEOUT_MS);
  let r;
  try{
    r=await fetch(`/api/gene_wiki?gene=${encodeURIComponent(g)}&taxid=${taxid}`, ac?{signal:ac.signal}:undefined);
  }catch(e){
    clearTimeout(timer);
    /* Only a genuinely unreachable server lands here now. An abort is our own deadline firing,
       which means the server is up but the database behind it is not keeping up. */
    return lookupFailed(g, (e&&e.name==='AbortError')
      ? 'RETICLE is taking too long to answer — the gene database is likely under load. Nothing is wrong with '+g+'.'
      : 'Could not reach RETICLE. Check your connection.', true);
  }
  clearTimeout(timer);
  /* Read the body ONCE, as text, then try to parse. A 500 from uvicorn is the plain string
     "Internal Server Error"; parsing it first is what used to hide the real status code. */
  let body='', d=null;
  try{ body=await r.text(); d=JSON.parse(body); }catch(e){ d=null; }
  if(!r.ok){
    if(r.status===404) return lookupFailed(g, (d&&(d.detail||d.error))||('No gene called '+g+' in the knowledge base.'), false);
    if(r.status===422) return lookupFailed(g, (d&&(d.detail||d.error))||('"'+g+'" is not a valid gene symbol.'), false);
    /* 5xx: the server answered, so this is not a connectivity problem. Say so, and offer the
       retry rather than making the user retype the gene. */
    return lookupFailed(g, 'The gene database is not responding right now. This is not a problem with '+g+' — try again in a moment.', true);
  }
  if(!d||!d.identity) return lookupFailed(g, 'RETICLE returned a response it could not read for '+g+'.', true);
  st.style.display='none';
  history.replaceState(null,'',`/gene?gene=${encodeURIComponent(d.identity.symbol)}&taxid=${taxid}`);
  document.title=`${d.identity.symbol} · RETICLE gene wiki`;
  window.scrollTo(0,0);
  render(d);
}

// dot-wave field pinned to the bottom of the landing screen (ported from the harmonization prototype)
function initWave(){
  const canvas=document.getElementById('wave-canvas'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const mouse={x:-1000,y:-1000,active:false};
  function resize(){const r=canvas.getBoundingClientRect();const dpr=window.devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  window.addEventListener('resize',resize); resize();
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.active=true;});
  canvas.addEventListener('mouseleave',()=>{mouse.active=false;mouse.x=mouse.y=-1000;});
  const cols=50,rows=8,rowSpacing=8; let time=0;
  function animate(){
    if(!document.body.classList.contains('landing')) return;   // stop once a gene is shown
    const dpr=window.devicePixelRatio||1, W=canvas.width/dpr, H=canvas.height/dpr;
    ctx.clearRect(0,0,W,H); time+=0.015;
    const spacingX=W/(cols-1), midY=H/2;
    for(let r=0;r<rows;r++){
      const depth=r/(rows-1), alpha=0.12+depth*0.4, size=1.0+depth*2.0;
      for(let c=0;c<cols;c++){
        const baseX=c*spacingX, baseY=midY+(r-(rows-1)/2)*rowSpacing;
        const angle=c*0.15+time+r*0.4, waveOffset=Math.sin(angle)*12*(0.6+depth*0.8);
        let x=baseX, y=baseY+waveOffset;
        if(mouse.active){const dx=x-mouse.x,dy=y-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<80){const f=(80-dist)/80,a=Math.atan2(dy,dx);x+=Math.cos(a)*f*15;y+=Math.sin(a)*f*10;}}
        const p=c/(cols-1);
        const red=Math.round(31+p*(224-31)), green=Math.round(111+p*(138-111)), blue=Math.round(139+p*(60-139));
        ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2); ctx.fillStyle=`rgba(${red},${green},${blue},${alpha})`; ctx.fill();
      }
    }
    requestAnimationFrame(animate);
  }
  animate();
}
initWave();

/* ---------- global nav: mark active tab, carry the current gene across features ---------- */
(function(){
  const path=location.pathname, sp=new URLSearchParams(location.search);
  const cur = /^\/(network|net)/.test(path) ? 'network'
            : /^\/(screen)/.test(path)      ? 'screen' : 'gene';
  const gene = sp.get('gene')||'';
  const tax  = sp.get('taxid') || (sp.get('organism')==='mouse' ? '10090' : '9606');
  document.querySelectorAll('.gnav-tabs a').forEach(a=>{
    const t=a.dataset.t;
    if(t===cur) a.classList.add('on');
    if(gene){                                   // keep the gene when switching feature
      a.href = t==='gene'    ? `/gene?gene=${encodeURIComponent(gene)}&taxid=${tax}`
             : t==='network' ? `/network?gene=${encodeURIComponent(gene)}&organism=${tax==='10090'?'mouse':'human'}`
             : '/screen';
    }
  });
})();
