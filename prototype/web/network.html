<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RETICLE · Screen Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
:root{
  --paper:#FCFCFB; --ink:#14161A; --ink2:#3A3D44; --muted:#6B7280; --faint:#9AA0A6;
  --line:#E8E6E1; --line2:#F1EFEA; --card:#FFFFFF;
  --know:#1F6F8B; --eviq:#C77D31; --pred:#7C5CBF;
  --know-soft:#1F6F8B14; --eviq-soft:#C77D3114; --pred-soft:#7C5CBF14;
  --serif:"Fraunces",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
a{color:var(--know);text-decoration:none}a:hover{text-decoration:underline}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.mark{font-family:var(--serif);font-weight:500;font-size:19px;white-space:nowrap}
.mark b{color:var(--know);font-weight:600}
.mark s{font-family:var(--mono);font-size:10px;text-decoration:none;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-left:8px;vertical-align:2px}
.srch{display:flex;align-items:center;flex:1;max-width:340px;border:1px solid var(--line);border-radius:11px;background:var(--card);transition:border-color .2s,box-shadow .2s;padding:3px}
.srch:focus-within{border-color:var(--know);box-shadow:0 0 0 4px var(--know-soft)}
.srch input{flex:1;border:0;outline:0;background:transparent;font-family:var(--mono);font-size:14px;color:var(--ink);padding:8px 12px;letter-spacing:.02em}
.srch input::placeholder{color:var(--faint);font-family:var(--sans);letter-spacing:0}
.srch button{border:0;background:var(--ink);color:#fff;font-family:var(--sans);font-weight:500;font-size:13px;padding:8px 15px;border-radius:8px;cursor:pointer}
.navlink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* controls */
.controls{display:flex;align-items:center;gap:18px;padding:11px 22px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.ctl-lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.pill{font-family:var(--sans);font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s}
.pill:hover{border-color:var(--know)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--know);width:15px;height:15px}
.grow{flex:1}

/* main split */
.wrap{display:flex;height:calc(100vh - 108px)}
#cy{flex:1;background:
   radial-gradient(circle at 1px 1px, var(--line2) 1px, transparent 0) 0 0/22px 22px, var(--paper)}
.panel{width:290px;border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:20px}
.panel h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 3px}
.panel .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:16px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line2)}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;font-family:var(--mono)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:11px;letter-spacing:.04em}
.t-ess{background:var(--know-soft);color:var(--know)} .t-adv{background:var(--eviq-soft);color:var(--eviq)}
.t-mix{background:#6B72801a;color:var(--muted)} .t-unk{background:#9AA0A614;color:var(--faint)}
.legend{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.legrow{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);margin:8px 0}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
.foot{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:8px 22px;border-top:1px solid var(--line);letter-spacing:.03em;background:var(--card)}
.status{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:13px;color:var(--muted)}
.partner{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line2);cursor:pointer}
.partner:hover b{color:var(--know)} .partner b{font-family:var(--mono);font-weight:500}
.partner .r{font-family:var(--mono);font-size:11px;color:var(--eviq)}

/* AI function prediction (gpt-5, over OUR OWN net_edge co-essentiality) */
.predict-box{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.predbtn{width:100%;font-family:var(--sans);font-size:13px;font-weight:500;padding:9px 12px;
  border:1px solid var(--pred);border-radius:10px;background:var(--pred-soft);color:var(--pred);
  cursor:pointer;transition:background .15s}
.predbtn:hover{background:#7C5CBF22}
.predbtn:disabled{opacity:.55;cursor:default}
.pred-note{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:8px}
.pred-load{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px}
.pred-dot{width:6px;height:6px;border-radius:50%;background:var(--pred);animation:predpulse 1.1s infinite ease-in-out}
@keyframes predpulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.pred-err{font-size:12.5px;color:#B23A3A;margin-top:10px;line-height:1.5}
.pred-summary{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.5;font-style:italic}
.pred-cards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pred-card{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--paper)}
.pred-card .pc-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pred-card .pc-name{font-family:var(--serif);font-size:14.5px;font-weight:500;color:var(--ink)}
.pc-type{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.pc-conf{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:1px 7px;border-radius:10px;margin-left:auto}
.pc-conf.high{background:var(--know-soft);color:var(--know)}
.pc-conf.moderate{background:var(--pred-soft);color:var(--pred)}
.pc-conv{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px}
.pc-rat{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:7px}
.pc-supp{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pc-chip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:12px;
  padding:2px 8px;color:var(--muted);cursor:pointer;background:var(--card);transition:.15s}
.pc-chip:hover{border-color:var(--know);color:var(--know)}
.pc-chip b{font-weight:500}
/* ---------- global feature nav (shared: index / gene / network) ---------- */
.gnav{position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:16px;padding:9px 20px;
  background:rgba(252,252,251,.94);backdrop-filter:blur(10px);border-bottom:1px solid #E8E6E1}
.gnav-brand{font-family:Fraunces,Georgia,serif;font-size:18px;font-weight:600;color:#14161A;
  text-decoration:none;letter-spacing:.01em;white-space:nowrap}
.gnav-brand b{color:#1F6F8B}
.gnav-tabs{display:flex;gap:4px}
.gnav-tabs a{font-size:13px;padding:5px 13px;border-radius:20px;text-decoration:none;color:#6B7280;
  white-space:nowrap;transition:background .12s,color .12s}
.gnav-tabs a:hover{background:#F1EFEA;color:#14161A}
.gnav-tabs a.on{background:#14161A;color:#fff}
.gnav-sp{flex:1}
@media(max-width:760px){.gnav{gap:8px;padding:8px 12px}.gnav-tabs a{padding:5px 9px;font-size:12px}}
</style>

<nav class="gnav">
  <a class="gnav-brand" href="/">RETI<b>C</b>LE</a>
  <div class="gnav-tabs">
    <a href="/" data-t="gene">Gene</a>
    <a href="/screen" data-t="screen">Screen</a>
    <a href="/network" data-t="network">Network</a>
  </div>
  <div class="gnav-sp"></div>
  <form class="srch" onsubmit="go(event)">
    <input id="q" placeholder="gene symbol — e.g. FANCD2" autocomplete="off" spellcheck="false">
    <button type="submit">Map</button>
  </form>
</nav>

<div class="controls">
  <span class="ctl-lab">Species</span>
  <div id="orgpills" style="display:flex;gap:8px">
    <button class="pill on" data-org="human">Human</button>
    <button class="pill" data-org="mouse">Mouse</button>
  </div>
  <span class="ctl-lab" style="margin-left:16px">Context</span>
  <div id="ctxpills" style="display:flex;gap:8px"></div>
  <div class="grow"></div>
  <label class="toggle"><input type="checkbox" id="recip" checked> reciprocal only <span style="color:var(--faint)">(mutual-best)</span></label>
</div>

<div class="wrap" style="position:relative">
  <div id="cy"></div>
  <div id="status" class="status"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="foot">Pure BioGRID CRISPR co-essentiality · no STRING, no literature · edges pooled across all genome-wide screens per species — <b>Human</b> (1,377 screens) and <b>Mouse</b> (87 screens) live in separate networks; the mouse network is exploratory.</div>

<script>
const LEAN_COLOR={essential:'#1F6F8B',advantageous:'#C77D31',mixed:'#8A8F98',null:'#C7CBD1'};
const LEAN_BORDER={essential:'#155568',advantageous:'#9c5f22',mixed:'#6B7280',null:'#9AA0A6'};
let CY=null, ORG='human', CTX='all', RECIP=true, FOCUS='FANCD2', CONTEXTS=[];
const DEFAULT_FOCUS={human:'FANCD2', mouse:'Rpl13'};
const DEFAULT_CTX={human:'all', mouse:'mouse'};

const cyStyle=[
  {selector:'node',style:{
    'background-color':n=>LEAN_COLOR[n.data('lean')]||LEAN_COLOR.null,
    'border-color':n=>LEAN_BORDER[n.data('lean')]||LEAN_BORDER.null,
    'border-width':2,'width':n=>18+8*Math.sqrt(n.data('degree')||1),'height':n=>18+8*Math.sqrt(n.data('degree')||1),
    'label':'data(label)','font-family':'IBM Plex Mono','font-size':11,'color':'#3A3D44',
    'text-valign':'bottom','text-margin-y':4,'text-halign':'center'}},
  {selector:'node[?focus]',style:{'border-color':'#14161A','border-width':4,'width':42,'height':42,
    'font-size':14,'font-weight':600,'color':'#14161A','z-index':10}},
  {selector:'edge',style:{'line-color':'#C9CDC7','width':e=>1+5*Math.max(0,e.data('strength')),
    'curve-style':'straight','opacity':.7}},
  {selector:'edge[!reciprocal]',style:{'line-color':'#DFE2DC','line-style':'dashed','opacity':.5}},
  {selector:'.sel',style:{'line-color':'#1F6F8B','opacity':1,'width':3.5}},
  {selector:'node.dim',style:{'opacity':.22}},{selector:'edge.dim',style:{'opacity':.06}},
];

async function loadContexts(){
  const r=await fetch('/api/net_contexts?organism='+ORG);const j=await r.json();
  CONTEXTS=j.contexts||[];
  const box=document.getElementById('ctxpills');box.innerHTML='';
  CONTEXTS.forEach(c=>{
    const b=document.createElement('button');b.className='pill'+(c.value===CTX?' on':'');
    b.textContent=c.label;b.title=`${c.n_nodes.toLocaleString()} genes · ${c.n_reciprocal.toLocaleString()} reciprocal edges`;
    b.onclick=()=>{CTX=c.value;[...box.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');load();};
    box.appendChild(b);
  });
}
function setupOrgPills(){
  document.querySelectorAll('#orgpills button').forEach(b=>{
    b.onclick=async()=>{
      if(b.dataset.org===ORG)return;
      ORG=b.dataset.org;
      document.querySelectorAll('#orgpills button').forEach(x=>x.classList.toggle('on',x.dataset.org===ORG));
      CTX=DEFAULT_CTX[ORG];FOCUS=DEFAULT_FOCUS[ORG];
      document.getElementById('q').value='';document.getElementById('q').placeholder=FOCUS;
      await loadContexts();load();
    };
  });
}
function status(t){const s=document.getElementById('status');s.textContent=t||'';s.style.display=t?'block':'none';}

async function load(){
  status('mapping '+FOCUS+' …');
  const u=`/api/screen_net?gene=${encodeURIComponent(FOCUS)}&context=${encodeURIComponent(CTX)}&reciprocal=${RECIP?1:0}&organism=${ORG}`;
  let j;try{j=await (await fetch(u)).json();}catch(e){status('request failed');return;}
  if(j.error){status(j.error);if(CY)CY.elements().remove();renderPanel(null);return;}
  status('');FOCUS=j.focus;document.getElementById('q').placeholder=j.focus;
  const els=[
    ...j.nodes.map(n=>({data:{id:n.id,label:n.label,lean:String(n.lean),focus:n.focus,degree:n.degree,mean_percentile:n.mean_percentile}})),
    ...j.edges.map(e=>({data:{id:e.source+'__'+e.target,source:e.source,target:e.target,strength:e.strength,reciprocal:e.reciprocal}})),
  ];
  if(!CY){
    CY=cytoscape({container:document.getElementById('cy'),elements:els,style:cyStyle,
      minZoom:.2,maxZoom:3,wheelSensitivity:.25});
    CY.on('tap','node',ev=>{const d=ev.target.data();if(d.id!==FOCUS){FOCUS=d.id;load();}else selectNode(ev.target);});
    CY.on('tap','edge',ev=>selectEdge(ev.target));
    CY.on('tap',ev=>{if(ev.target===CY){CY.elements().removeClass('dim sel');renderPanel(j);}});
  }else{CY.elements().remove();CY.add(els);}
  CY.layout({name:'cose',animate:true,animationDuration:600,padding:60,nodeRepulsion:22000,idealEdgeLength:118,nodeOverlap:28,componentSpacing:150,gravity:.25,coolingFactor:.96}).run();
  renderPanel(j);
}

function selectNode(node){
  CY.elements().addClass('dim');const nb=node.closedNeighborhood();nb.removeClass('dim');
  node.connectedEdges().removeClass('dim').addClass('sel');
  const d=node.data();
  const partners=node.connectedEdges().map(e=>{const o=e.source().id()===d.id?e.target():e.source();
     return{id:o.id(),strength:e.data('strength'),reciprocal:e.data('reciprocal')};}).sort((a,b)=>b.strength-a.strength);
  document.getElementById('panel').innerHTML=
    `<h3>${d.label}</h3><div class="sub">${d.focus?'focus gene':'partner'} · ${leanText(d.lean)}</div>`+
    kv('fitness mean', d.mean_percentile==null?'—':(d.mean_percentile>0?'+':'')+d.mean_percentile)+
    kv('partners here', partners.length)+
    `<div style="margin-top:14px"><div class="ctl-lab" style="margin-bottom:6px">co-essential partners</div>`+
    partners.map(p=>`<div class="partner" onclick="jump('${p.id}')"><b>${p.id}</b><span class="r">r ${p.strength}${p.reciprocal?' ⇄':''}</span></div>`).join('')+
    `</div><div class="hint"><a href="/gene?gene=${d.label}">Open ${d.label} in the gene wiki →</a></div>`;
}
function selectEdge(edge){
  CY.elements().addClass('dim');CY.elements().removeClass('sel');
  edge.removeClass('dim').addClass('sel');edge.source().removeClass('dim');edge.target().removeClass('dim');
  const d=edge.data();
  document.getElementById('panel').innerHTML=
    `<h3 style="font-family:var(--mono);font-size:15px">${d.source} — ${d.target}</h3>`+
    `<div class="sub">co-essential edge · ${CTX}</div>`+
    kv('correlation r', d.strength)+kv('mutual-best', d.reciprocal?'yes ⇄':'one-directional')+
    `<div class="hint">These two genes' knockout-fitness profiles track each other across the genome-wide screens of this context.</div>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function renderPanel(j){
  if(!j){document.getElementById('panel').innerHTML=`<div class="sub" style="margin-top:8px">No graph.</div>`+legend();return;}
  const n=j.nodes.length,e=j.edges.length;
  document.getElementById('panel').innerHTML=
    `<h3>${j.focus}</h3><div class="sub">${j.context_label}</div>`+
    kv('neighborhood', n+' genes')+kv('edges', e)+
    kv('view', j.fellback?'<span style="color:var(--eviq)">one-directional</span>':(j.reciprocal_only?'reciprocal only':'all top-k'))+
    (j.fellback?`<div class="hint" style="color:var(--eviq);margin:6px 0 0">${esc(j.focus)} has no <b>mutual-best</b> partner — showing its one-directional partners instead.</div>`:'')+
    `<div class="hint">Click a <b>gene</b> to recenter the map on it, or an <b>edge</b> to inspect the correlation. Toggle <b>reciprocal only</b> to loosen or tighten the graph.</div>`+
    `<div class="predict-box">
       <button class="predbtn" id="predbtn" onclick="predictFn()">✳ Predict undiscovered function (gpt-5) →</button>
       <div class="pred-note">Reasons over ${esc(j.focus)}'s co-essential partners in <b>this</b> network — RETICLE's own BioGRID data, not STRING or DepMap — to propose a shared complex/pathway/process it isn't yet annotated with.</div>
       <div id="predout"></div>
     </div>`+
    legend();
}

async function predictFn(){
  const host=document.getElementById('predout'), btn=document.getElementById('predbtn');
  if(!host||!btn) return;
  const label=btn.textContent;
  btn.disabled=true;
  host.innerHTML=`<div class="pred-load"><span class="pred-dot"></span> gpt-5 is reading ${esc(FOCUS)}'s co-essential partners' known functions…</div>`;
  try{
    const r=await fetch(`/api/net_predict?gene=${encodeURIComponent(FOCUS)}&organism=${ORG}&context=${encodeURIComponent(CTX)}`);
    const j=await r.json();
    if(!r.ok){ host.innerHTML=`<div class="pred-err">${esc(j.error||'Prediction failed.')}</div>`; }
    else renderPrediction(j);
  }catch(e){ host.innerHTML=`<div class="pred-err">Could not reach the server.</div>`; }
  btn.disabled=false; btn.textContent=label;
}

function renderPrediction(j){
  const host=document.getElementById('predout'); if(!host) return;
  const caption=`<div class="pred-note">${j.n_annotated_partners}/${j.n_partners} partners with known function · ${esc(j.context_label)}${j.model?` · <span style="color:var(--pred)">${esc(j.model)}</span>`:''}</div>`;
  if(!j.predictions || !j.predictions.length){
    host.innerHTML=caption+`<div class="pred-summary">${esc(j.summary||'No convergent, novel function emerged from this neighborhood.')}</div>`;
    return;
  }
  const cards=j.predictions.map(p=>{
    const chips=p.supporting_partners.map(s=>
      `<span class="pc-chip" onclick="jump('${esc(s.symbol)}')"><b>${esc(s.symbol)}</b> r ${s.strength.toFixed(2)}${s.reciprocal?' ⇄':''}</span>`).join('');
    return `<div class="pred-card">
      <div class="pc-h"><span class="pc-name">${esc(p.prediction)}</span><span class="pc-type">${esc(p.type)}</span><span class="pc-conf ${p.confidence}">${esc(p.confidence)}</span></div>
      <div class="pc-conv">${esc(p.convergence)}</div>
      <div class="pc-rat">${esc(p.rationale)}</div>
      <div class="pc-supp">${chips}</div>
    </div>`;
  }).join('');
  host.innerHTML=caption+`<div class="pred-cards">${cards}</div>`+(j.summary?`<div class="pred-summary">${esc(j.summary)}</div>`:'');
}
const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
function leanText(l){return l==='essential'?'<span class="tag t-ess">essential</span>':l==='advantageous'?'<span class="tag t-adv">KO-advantageous</span>':l==='mixed'?'<span class="tag t-mix">mixed</span>':'<span class="tag t-unk">unrated</span>';}
function legend(){return `<div class="legend"><div class="ctl-lab" style="margin-bottom:8px">node = gene · color = fitness role</div>`+
  [['essential','#1F6F8B','#155568','KO deleterious (essential)'],['advantageous','#C77D31','#9c5f22','KO advantageous'],['mixed','#8A8F98','#6B7280','no clear fitness lean']]
  .map(x=>`<div class="legrow"><span class="dot" style="background:${x[1]};border-color:${x[2]}"></span>${x[3]}</div>`).join('')+
  `<div class="legrow" style="margin-top:6px"><span style="width:22px;border-top:2px solid #C9CDC7"></span>reciprocal edge</div>`+
  `<div class="legrow"><span style="width:22px;border-top:2px dashed #DFE2DC"></span>one-directional</div></div>`;}

function go(ev){ev.preventDefault();const v=document.getElementById('q').value.trim();if(v){FOCUS=v;load();}}
function jump(g){FOCUS=g;load();}
document.getElementById('recip').onchange=e=>{RECIP=e.target.checked;load();};

/* accept ?gene=&organism= so the global nav can carry the current gene in from the wiki */
(function(){
  const sp=new URLSearchParams(location.search);
  const g=sp.get('gene'), o=sp.get('organism')||(sp.get('taxid')==='10090'?'mouse':null);
  if(o==='mouse'){ ORG='mouse'; CTX=DEFAULT_CTX.mouse; FOCUS=DEFAULT_FOCUS.mouse;
    document.querySelectorAll('#orgpills button').forEach(x=>x.classList.toggle('on',x.dataset.org==='mouse')); }
  if(g){ FOCUS=g; const qi=document.getElementById('q'); if(qi) qi.placeholder=g; }
})();
(async()=>{setupOrgPills();await loadContexts();await load();})();

/* ---------- global nav: mark active tab, carry the current gene across features ---------- */
(function(){
  const path=location.pathname, sp=new URLSearchParams(location.search);
  const cur = /^\/(network|net)/.test(path) ? 'network'
            : /^\/(screen)/.test(path)      ? 'screen' : 'gene';
  const gene = sp.get('gene')||'';
  const tax  = sp.get('taxid') || (sp.get('organism')==='mouse' ? '10090' : '9606');
  document.querySelectorAll('.gnav-tabs a').forEach(a=>{
    const t=a.dataset.t;
    if(t===cur) a.classList.add('on');
    if(gene){                                   // keep the gene when switching feature
      a.href = t==='gene'    ? `/gene?gene=${encodeURIComponent(gene)}&taxid=${tax}`
             : t==='network' ? `/network?gene=${encodeURIComponent(gene)}&organism=${tax==='10090'?'mouse':'human'}`
             : '/screen';
    }
  });
})();

</script>
